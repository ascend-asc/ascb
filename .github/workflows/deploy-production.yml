name: Prepare ASCB production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type prepare-production to deploy to the isolated production directory
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ascb-production-preparation
  cancel-in-progress: false

env:
  SSH_HOST: server245.web-hosting.com
  SSH_PORT: "21098"
  SSH_USER: ascblzri
  DEPLOY_PATH: /home/ascblzri/ascb-production

jobs:
  validate-and-deploy:
    name: Validate and prepare production files
    if: github.event.inputs.confirmation == 'prepare-production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, fileinfo
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          find ascend_website -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ascb_production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ascb_production ~/.ssh/known_hosts

      - name: Verify isolated production destination
        shell: bash
        run: |
          test "$DEPLOY_PATH" = "/home/ascblzri/ascb-production"
          for attempt in 1 2 3; do
            if ssh -o ConnectTimeout=20 -i ~/.ssh/ascb_production -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "test -d '$DEPLOY_PATH/public_html' && test -d '$DEPLOY_PATH/config' && test -f '$DEPLOY_PATH/config/config.local.php'"; then
              exit 0
            fi
            echo "SSH attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Deploy to isolated production directory
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if rsync -az --delete-delay \
              --exclude='.git/' \
              --exclude='config/config.local.php' \
              --include='public_html/uploads/' \
              --include='public_html/uploads/.htaccess' \
              --exclude='public_html/uploads/***' \
              --exclude='*.sql' \
              --exclude='*.log' \
              -e "ssh -o ConnectTimeout=20 -i ~/.ssh/ascb_production -p $SSH_PORT" \
              ascend_website/ \
              "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"; then
              exit 0
            fi
            echo "Deployment attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Verify prepared production files
        shell: bash
        run: |
          ssh -o ConnectTimeout=20 -i ~/.ssh/ascb_production -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -f '$DEPLOY_PATH/public_html/index.php' && test -f '$DEPLOY_PATH/config/config.local.php' && test -d '$DEPLOY_PATH/app'"

